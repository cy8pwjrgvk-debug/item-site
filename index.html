<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>タンク図鑑</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
    }

    .tank-card {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .tank-image {
      width: 150px;
      height: 150px;
      margin: 0 auto 25px;
      background: #e53935;
      border-radius: 50%;
    }

    .name {
      text-align: center;
      font-size: 30px;
      margin-bottom: 25px;
    }

    .info {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 18px;
    }

    .label {
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #999;
    }
  </style>
</head>

<body>

  <header>
    <h1>📖 タンク図鑑</h1>
    <div class="subtitle">Tank Encyclopedia</div>
  </header>

  <main class="tank-card">

    <div class="tank-image"></div>

    <h2 class="name">ノーマル</h2>

    <div class="info">
      <span class="label">説明：</span>
      タンクゲームの原点
    </div>

    <div class="info">
      <span class="label">レア度：</span>
      ⭐️1
    </div>

    <div class="info">
      <span class="label">タイプ：</span>
      安定型
    </div>

    <div class="info">
      <span class="label">使いやすさ：</span>
      ⭐️5
    </div>

    <div class="info">
      <span class="label">強さ：</span>
      ⭐️1
    </div>

  </main>

  <footer>
    © Tank Encyclopedia
  </footer>

</body>
</html>
