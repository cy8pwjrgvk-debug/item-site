<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>タンク図鑑</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", sans-serif;
      background: #f4f8fb;
      color: #333;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: white;
      border-bottom: 1px solid #e8edf1;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #8a949c;
      font-size: 14px;
    }

    .tank-card {
      width: calc(100% - 30px);
      max-width: 520px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    /* ノーマルの画像 */
    .tank-image {
      width: 100%;
      max-width: 320px;
      height: 230px;
      object-fit: contain;
      display: block;
      margin: 0 auto 25px;
      border-radius: 20px;
    }

    .name {
      text-align: center;
      font-size: 30px;
      margin: 0 0 25px;
    }

    .info {
      padding: 15px 5px;
      border-bottom: 1px solid #eeeeee;
      font-size: 18px;
      line-height: 1.6;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      margin-right: 5px;
    }

    .stars {
      letter-spacing: 2px;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📖 タンク図鑑</h1>
    <div class="subtitle">Tank Encyclopedia</div>
  </header>

  <main class="tank-card">

    <img
      class="tank-image"
      src="IMG_3263.jpeg"
      alt="ノーマル"
    >

    <h2 class="name">ノーマル</h2>

    <div class="info">
      <span class="label">説明：</span>
      タンクゲームの原点
    </div>

    <div class="info">
      <span class="label">レア度：</span>
      <span class="stars">⭐️1</span>
    </div>

    <div class="info">
      <span class="label">タイプ：</span>
      安定型
    </div>

    <div class="info">
      <span class="label">使いやすさ：</span>
      <span class="stars">⭐️5</span>
    </div>

    <div class="info">
      <span class="label">強さ：</span>
      <span class="stars">⭐️1</span>
    </div>

  </main>

  <footer>
    © Tank Encyclopedia
  </footer>

</body>
</html>
